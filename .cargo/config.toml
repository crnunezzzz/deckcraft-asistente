# Local development builds embed the craft-fonts checkout next to this repo when it exists
# (build.rs warns and continues without it). CI and releases set CRAFT_FONTS_DIR explicitly.
[env]
CRAFT_FONTS_DIR = { value = "../craft-fonts", relative = true }

[alias]
xtask = "run --package xtask --"

# DeckCraft IA (this fork): native Android development packages, optimized without whole-program
# LTO. Kept here rather than in Cargo.toml so merging the original project never meets it.
[profile.android]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 64
